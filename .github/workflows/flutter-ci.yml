name: Flutter CI

# The only job that runs automatically. Lint/format/unit/widget
# only — no device, no emulator/simulator, so no Android SDK/Java/Xcode is
# needed here. Real device/emulator/simulator integration tests live in
# flutter-integration.yml, gated behind workflow_dispatch, so it
# never runs on push.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'codemagic.yaml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'app/**'
      - 'codemagic.yaml'
      - '.github/workflows/**'

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analyze (must be zero errors, warnings AND infos)
        run: flutter analyze
      # What `make start-web` compiles, so the web dev loop cannot go back to
      # not building: a native-only import (dart:ffi, via drift/native.dart)
      # reaching this entrypoint fails here and nowhere else, since every
      # other check runs on the VM where those libraries exist.
      - name: Web dev-loop target compiles
        working-directory: .
        run: make check-web

  test:
    name: Test (unit + widget)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # `flutter test` (no path) only runs `test/` — `integration_test/` is a
      # separate top-level directory it does not recurse into, so this is
      # unit + widget only, never the device-bound suite.
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      # Runners are UTC, which has no clock changes. Run in a daylight-saving zone
      # so a Duration-based "add 7 days" that drifts an hour (#177) fails here too.
      - name: flutter test (Europe/London, observes DST)
        run: flutter test
        env:
          TZ: Europe/London
      # grep exits 1 only when every path was scanned and nothing matched. A
      # match (0) or a missing path (2) both fail, so a renamed directory
      # cannot turn this guard into a no-op.
      - name: Release lanes never target main_e2e.dart
        working-directory: .
        run: |
          set +e
          grep -rn 'main_e2e' app/fastlane app/ios/fastlane codemagic.yaml .github/workflows \
            --exclude=flutter-ci.yml --exclude=flutter-integration.yml
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo 'A release path references main_e2e.dart, or a scanned path is missing'
            exit 1
          fi
