name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
      - name: Run pytest
        run: uv run pytest --cov --cov-fail-under=80

  deploy-prod:
    name: Deploy (prod)
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    # A newer push replaces a deploy still waiting for approval, so only the
    # latest main ever needs approving. A deploy already running finishes:
    # cancelling sam deploy mid-update leaves the stack busy and fails the next.
    concurrency:
      group: backend-deploy-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          # The deploy script checks HEAD is an ancestor of origin; a shallow clone can't answer that
          # when main moved on after this run was queued.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
      # The same script `make deploy-prod` runs: it reads every prod parameter from backend/samconfig.toml
      # (the template resolves the OAuth client from Secrets Manager), stamps the commit and checks the
      # live stack afterwards, so CI and manual deploys of one commit are identical.
      - name: Deploy
        run: python3 scripts/deploy_prod.py
