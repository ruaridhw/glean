name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - name: Run pytest
        run: uv run pytest --cov --cov-fail-under=80

  deploy-prod:
    name: Deploy (prod)
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Fetch Google OAuth credentials
        run: |
          GOOGLE_CLIENT_ID=$(aws secretsmanager get-secret-value --secret-id glean/prod/google-oauth-client-id --query SecretString --output text)
          GOOGLE_CLIENT_SECRET=$(aws secretsmanager get-secret-value --secret-id glean/prod/google-oauth-client-secret --query SecretString --output text)
          echo "::add-mask::$GOOGLE_CLIENT_ID"
          echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" >> "$GITHUB_ENV"
          echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
      - name: SAM build
        run: sam build
      - name: SAM deploy
        run: |
          sam deploy \
            --config-env prod \
            --parameter-overrides "Environment=prod GoogleClientId=$GOOGLE_CLIENT_ID GoogleClientSecret=$GOOGLE_CLIENT_SECRET" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
