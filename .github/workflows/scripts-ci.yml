name: Scripts CI

# Runs the repo-root tooling tests in scripts/tests (commit-message policy,
# `make worktree`). The Flutter app's own scripts are covered by flutter-ci.yml.
on:
  push:
    branches: [main]
    paths:
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/scripts-ci.yml'
  pull_request:
    paths:
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/scripts-ci.yml'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
