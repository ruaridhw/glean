name: LLM Evals

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'OpenRouter model (e.g. anthropic/claude-sonnet-4.6, google/gemma-4-26b-a4b-it:free)'
        required: true
        default: 'google/gemma-4-26b-a4b-it:free'
        type: string

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  eval:
    name: Run Evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GLEAN_EVAL_MODEL: ${{ inputs.model }}
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
      LANGCHAIN_PROJECT: glean
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Receipt photo evals: textract mode uploads to this scratch bucket (never the production
      # receipts bucket) and is skipped when it is unset. vision mode needs neither.
      GLEAN_EVAL_S3_BUCKET: ${{ vars.GLEAN_EVAL_S3_BUCKET }}
      GLEAN_EVAL_AWS_ROLE_ARN: ${{ vars.GLEAN_EVAL_AWS_ROLE_ARN }}
      # The hard- and soft-gate steps share one set of paid photo scans through this directory.
      GLEAN_EVAL_SCAN_CACHE: results/scan-cache
      AWS_REGION: eu-west-2

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --dev

      - name: Configure AWS credentials for Textract evals
        if: vars.GLEAN_EVAL_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.GLEAN_EVAL_AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Create results directory
        run: mkdir -p results

      - name: Run structural evals (hard gate)
        id: hard_gate
        run: |
          uv run pytest tests/integration/evals/ -m "not soft_gate" -v --tb=short --no-cov \
            --junitxml=results/hard-gate.xml 2>&1 | tee results/hard-gate.txt
        continue-on-error: true

      - name: Run heuristic + judge evals (soft gate)
        id: soft_gate
        run: |
          uv run pytest tests/integration/evals/ -m "soft_gate" -v --tb=short --no-cov \
            --junitxml=results/soft-gate.xml 2>&1 | tee results/soft-gate.txt
        continue-on-error: true

      - name: Publish receipt photo eval scores
        if: always()
        run: |
          if [ -f results/receipt-photo-eval.md ]; then
            cat results/receipt-photo-eval.md >> "$GITHUB_STEP_SUMMARY"
            if grep -q "textract: not configured" results/receipt-photo-eval.md; then
              echo "::warning title=Textract evals not run::textract: not configured (set GLEAN_EVAL_S3_BUCKET and GLEAN_EVAL_AWS_ROLE_ARN)"
            fi
          fi

      - name: Generate PR comment
        if: always()
        run: |
          python scripts/generate_eval_comment.py \
            --hard-gate results/hard-gate.xml \
            --soft-gate results/soft-gate.xml \
            --model "${{ inputs.model }}" \
            > results/pr-comment.md

      - name: Post PR comment
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --json number -q '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file results/pr-comment.md
          else
            echo "No PR found for branch ${{ github.ref_name }}, skipping comment"
          fi

      - name: Fail if hard gate failed
        if: steps.hard_gate.outcome == 'failure'
        run: exit 1
