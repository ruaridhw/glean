name: Mobile CI

on:
  pull_request:
    paths:
      - 'mobile/**'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint, typecheck, and dead code
        run: npm run check

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run jest
        run: NODE_OPTIONS=--experimental-vm-modules npx jest --coverage

  build:
    name: Build Android APK
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Expo prebuild
        env:
          EXPO_PUBLIC_COGNITO_DOMAIN: ${{ secrets.COGNITO_DOMAIN }}
          EXPO_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.COGNITO_APP_CLIENT_ID }}
          EXPO_PUBLIC_API_URL: ${{ secrets.PROD_API_URL }}
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  build-ci:
    name: Build CI APK (E2E)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: eu-west-2

      - name: Get CI auth tokens
        run: |
          TOKENS=$(aws cognito-idp admin-initiate-auth \
            --user-pool-id "${{ secrets.COGNITO_USER_POOL_ID }}" \
            --client-id "${{ secrets.COGNITO_APP_CLIENT_ID }}" \
            --auth-flow USER_PASSWORD_AUTH \
            --auth-parameters "USERNAME=${{ secrets.CI_TEST_USER_EMAIL }},PASSWORD=${{ secrets.CI_TEST_USER_PASSWORD }}")
          ACCESS=$(echo "$TOKENS" | jq -r '.AuthenticationResult.AccessToken')
          REFRESH=$(echo "$TOKENS" | jq -r '.AuthenticationResult.RefreshToken')
          ID=$(echo "$TOKENS" | jq -r '.AuthenticationResult.IdToken')
          echo "::add-mask::$ACCESS"
          echo "::add-mask::$REFRESH"
          echo "::add-mask::$ID"
          echo "EXPO_PUBLIC_CI_ACCESS_TOKEN=$ACCESS" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_CI_REFRESH_TOKEN=$REFRESH" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_CI_ID_TOKEN=$ID" >> "$GITHUB_ENV"

      - name: Expo prebuild
        env:
          EXPO_PUBLIC_COGNITO_DOMAIN: ${{ secrets.COGNITO_DOMAIN }}
          EXPO_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.COGNITO_APP_CLIENT_ID }}
          EXPO_PUBLIC_API_URL: ${{ secrets.PROD_API_URL }}
          EXPO_PUBLIC_CI_ACCESS_TOKEN: ${{ env.EXPO_PUBLIC_CI_ACCESS_TOKEN }}
          EXPO_PUBLIC_CI_REFRESH_TOKEN: ${{ env.EXPO_PUBLIC_CI_REFRESH_TOKEN }}
          EXPO_PUBLIC_CI_ID_TOKEN: ${{ env.EXPO_PUBLIC_CI_ID_TOKEN }}
        run: npx expo prebuild --platform android --no-install

      - name: Build CI APK
        env:
          EXPO_PUBLIC_CI_ACCESS_TOKEN: ${{ env.EXPO_PUBLIC_CI_ACCESS_TOKEN }}
          EXPO_PUBLIC_CI_REFRESH_TOKEN: ${{ env.EXPO_PUBLIC_CI_REFRESH_TOKEN }}
          EXPO_PUBLIC_CI_ID_TOKEN: ${{ env.EXPO_PUBLIC_CI_ID_TOKEN }}
        run: cd android && ./gradlew assembleRelease

      - name: Upload CI APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-ci
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1

  e2e:
    name: E2E
    needs: build-ci
    if: github.event_name == 'workflow_dispatch' && needs.build-ci.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      API_LEVEL: 35
      ARCH: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download CI APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk-ci
          path: mobile/artifacts

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: ${{ env.ARCH }}
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          force-avd-creation: false
          script: echo 'Generated AVD snapshot for caching.'

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: ${{ env.ARCH }}
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          force-avd-creation: false
          script: |
            adb install mobile/artifacts/app-release.apk
            maestro test --env APP_ID=com.ruaridhw.glean mobile/e2e/

      - name: Zip Maestro artifacts
        if: failure()
        run: cd ~/.maestro/tests && zip -r /tmp/maestro-artifacts.zip .

      - name: Upload Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts
          path: /tmp/maestro-artifacts.zip
          retention-days: 14

  deploy:
    name: Deploy
    needs: [lint, test, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: mobile/artifacts

      - name: Bump patch version
        run: |
          CURRENT=$(node -e "console.log(require('./app.json').expo.version)")
          NEXT=$(echo "$CURRENT" | awk -F. '{print $1"."$2"."$3+1}')
          sed -i "s/\"version\": \"$CURRENT\"/\"version\": \"$NEXT\"/" app.json

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.json
          git commit -m "🔖 chore: bump patch version [skip ci]"
          git push

      - name: Get app version
        id: app-version
        run: |
          VERSION=$(node -e "const c = require('./app.json'); console.log(c.expo.version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.app-version.outputs.version }}" \
            artifacts/app-release.apk \
            --title "v${{ steps.app-version.outputs.version }}" \
            --notes "Android APK built from commit ${{ github.sha }}" \
            --repo "${{ github.repository }}"
