AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Metadata:
  # E3505 wants the queue's visibility timeout to exceed the function's timeout, so a message is never
  # handed out twice while its handler still runs. This stack wants the opposite (ADR 0026): liveness
  # IS the 60 s lease, renewed every 20 s while the graph runs, so a worker that dies mid-run has its
  # message reappear within a minute instead of blocking the session. A duplicate delivery is
  # harmless: glean.agent.start only begins on a conditional queued -> running write, so the second
  # delivery finds the session already running and drops it.
  cfn-lint:
    config:
      ignore_checks:
        - E3505

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.13
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        POWERTOOLS_SERVICE_NAME: glean
        LOG_LEVEL: INFO
        GIT_SHA: !Ref GitSha
  HttpApi:
    AccessLogSettings:
      DestinationArn: !GetAtt ApiAccessLogGroup.Arn
      # Request metadata only: no headers or bodies, so no tokens.
      Format: >-
        {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime",
        "httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","path":"$context.path",
        "status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength",
        "responseLatency":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev

  CognitoDomainPrefix:
    Type: String
    Default: glean-auth

  LangSmithTracing:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"

  LangSmithEndpoint:
    Type: String
    # The Glean LangSmith workspace is EU-hosted; the SDK otherwise defaults to the US
    # endpoint (https://api.smith.langchain.com) and every trace POST 403s. Override per
    # deploy only if the workspace region changes.
    Default: "https://eu.api.smith.langchain.com"

  # Commit the deploy was built from, stamped by scripts/deploy_prod.py (`<sha>` or `<sha>-dirty`).
  GitSha:
    Type: String
    Default: unknown

  # Per-user cap on paid-model requests. Counters are in memory, so this is per warm Lambda
  # container, not global across the fleet. 60 is the owner's testing default and is not yet
  # confirmed: enough session starts, resumes and swaps to work without tripping the limit.
  RateLimitPerHour:
    Type: Number
    Default: 60
    Description: Paid-model AI requests allowed per user per hour, per Lambda container.
  # How long a Generate session (and its checkpoints) outlives the tap. The app polls a session for
  # minutes, so this is only the backstop that keeps the two tables inside the free tier's storage.
  AgentSessionTtlHours:
    Type: Number
    Default: 24
    MinValue: 1

Resources:
  # Every user's on-device data is keyed by their Cognito `sub`. A new pool
  # means new subs, which would orphan that data, so never let a stack
  # delete or replacement take this pool with it.
  GleanUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: glean-user-pool
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn

  GleanUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${CognitoDomainPrefix}-${Environment}"
      UserPoolId: !Ref GleanUserPool

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref GleanUserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        # Resolved by CloudFormation at deploy time, so neither samconfig nor CI ever holds the values.
        client_id: !Sub "{{resolve:secretsmanager:glean/${Environment}/google-oauth-client-id:SecretString}}"
        client_secret: !Sub "{{resolve:secretsmanager:glean/${Environment}/google-oauth-client-secret:SecretString}}"
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        username: sub

  GleanUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdentityProvider
    Properties:
      ClientName: glean-mobile-client
      UserPoolId: !Ref GleanUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - Google
      CallbackURLs:
        - glean://auth/callback
      LogoutURLs:
        - glean://auth/logout

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  GleanReceiptsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "glean-receipts-${Environment}-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          # Scanned receipt images are a one-day buffer. Scoped to their prefix so it can't reach exports.
          - Id: expire-receipt-scans
            Status: Enabled
            Prefix: receipts/
            ExpirationInDays: 1
          # Export diagnostics (POST /dev/export-db) are kept long enough to fetch and inspect.
          - Id: keep-diagnostics-exports
            Status: Enabled
            Prefix: db-exports/
            ExpirationInDays: 30

  # Durable store for the recipe corpus + recipe-api HTTP cache. No expiry — unlike the
  # receipts buffer, the corpus is durable data the app reads on every search/get.
  GleanRecipeCacheBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "glean-recipe-cache-${Environment}-${AWS::AccountId}"

  # Shared catalogue reference data (ADR 0001). Provisioned capacity is fixed so the whole
  # account stays inside the DynamoDB free tier: 5/5 for the table plus 5/5 for the GSI is
  # 10/10, against the 25/25 limit summed across every table and index in the region.
  GleanCatalogueTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "glean-catalogue-${Environment}"
      TableClass: STANDARD
      BillingMode: PROVISIONED
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: gsi_pk
          AttributeType: S
        - AttributeName: version
          AttributeType: N
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      GlobalSecondaryIndexes:
        - IndexName: by_version
          KeySchema:
            - AttributeName: gsi_pk
              KeyType: HASH
            - AttributeName: version
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  # One item per Generate tap (spec §6.3): the inputs, the status, a bounded list of progress lines,
  # and then the plan or a typed error. 2/2, with a TTL refreshed on every update. Two more tables take
  # the account to 15/15 of the 25/25 free tier (ADR 0001); with F1's 5/5 recipe table the stack is
  # 20/20.
  GleanAgentSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "glean-agent-sessions-${Environment}"
      TableClass: STANDARD
      BillingMode: PROVISIONED
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      ProvisionedThroughput:
        ReadCapacityUnits: 2
        WriteCapacityUnits: 2
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  # LangGraph's checkpoints, owned by the agent module (spec §6.2). 3/3, string PK/SK as the saver
  # expects, and the saver's own gzip compression and 24 h TTL are set in code, not here.
  GleanAgentCheckpointsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "glean-agent-checkpoints-${Environment}"
      TableClass: STANDARD
      BillingMode: PROVISIONED
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      ProvisionedThroughput:
        ReadCapacityUnits: 3
        WriteCapacityUnits: 3
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  # Lease-based liveness (ADR 0026): the worker renews this visibility timeout every 20 s while a run
  # continues, so a crashed worker's message reappears within a minute rather than waiting out the
  # function's timeout. After two failed attempts the dead-letter handler marks the session failed.
  GleanAgentDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "glean-agent-sessions-dlq-${Environment}"
      MessageRetentionPeriod: 1209600

  GleanAgentQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "glean-agent-sessions-${Environment}"
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt GleanAgentDeadLetterQueue.Arn
        maxReceiveCount: 2

  GleanFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: glean.main.handler
      Tracing: Active
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref GleanUserPool
          COGNITO_APP_CLIENT_ID: !Ref GleanUserPoolClient
          S3_RECEIPTS_BUCKET: !Ref GleanReceiptsBucket
          S3_RECIPE_CACHE_BUCKET: !Ref GleanRecipeCacheBucket
          CATALOGUE_TABLE: !Ref GleanCatalogueTable
          RATE_LIMIT_PER_HOUR: !Ref RateLimitPerHour
          AGENT_SESSIONS_TABLE: !Ref GleanAgentSessionsTable
          AGENT_CHECKPOINTS_TABLE: !Ref GleanAgentCheckpointsTable
          AGENT_SESSION_QUEUE_URL: !Ref GleanAgentQueue
          AGENT_SESSION_TTL_HOURS: !Ref AgentSessionTtlHours
          LANGSMITH_TRACING: !Ref LangSmithTracing
          LANGSMITH_API_KEY: !Sub "{{resolve:secretsmanager:glean/${Environment}/langsmith-api-key:SecretString}}"
          LANGSMITH_PROJECT: glean
          LANGSMITH_ENDPOINT: !Ref LangSmithEndpoint
          LANGCHAIN_CALLBACKS_BACKGROUND: "false"
      Policies:
        - AWSXrayWriteOnlyAccess
        - CloudWatchLogsFullAccess
        - S3CrudPolicy:
            BucketName: !Ref GleanReceiptsBucket
        - S3CrudPolicy:
            BucketName: !Ref GleanRecipeCacheBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref GleanCatalogueTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GleanAgentSessionsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt GleanAgentQueue.QueueName
        - arn:aws:iam::aws:policy/AmazonTextractFullAccess
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:glean/${Environment}/*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

  # The session worker (spec §6.3): same bundle as the API, one message at a time, and long enough to
  # plan without the HTTP API's 30 s cap. It renews the message's visibility while it runs.
  AgentWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: glean.worker.handler
      Timeout: 120
      MemorySize: 256
      Tracing: Active
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref GleanUserPool
          COGNITO_APP_CLIENT_ID: !Ref GleanUserPoolClient
          S3_RECEIPTS_BUCKET: !Ref GleanReceiptsBucket
          S3_RECIPE_CACHE_BUCKET: !Ref GleanRecipeCacheBucket
          CATALOGUE_TABLE: !Ref GleanCatalogueTable
          AGENT_SESSIONS_TABLE: !Ref GleanAgentSessionsTable
          AGENT_CHECKPOINTS_TABLE: !Ref GleanAgentCheckpointsTable
          AGENT_SESSION_QUEUE_URL: !Ref GleanAgentQueue
          AGENT_SESSION_TTL_HOURS: !Ref AgentSessionTtlHours
          LANGSMITH_TRACING: !Ref LangSmithTracing
          LANGSMITH_API_KEY: !Sub "{{resolve:secretsmanager:glean/${Environment}/langsmith-api-key:SecretString}}"
          LANGSMITH_PROJECT: glean
          LANGSMITH_ENDPOINT: !Ref LangSmithEndpoint
          LANGCHAIN_CALLBACKS_BACKGROUND: "false"
      Policies:
        - AWSXrayWriteOnlyAccess
        - CloudWatchLogsFullAccess
        - S3ReadPolicy:
            BucketName: !Ref GleanRecipeCacheBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref GleanAgentSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GleanAgentCheckpointsTable
        # Renewing the lease needs ChangeMessageVisibility; acknowledging needs DeleteMessage.
        - SQSPollerPolicy:
            QueueName: !GetAtt GleanAgentQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:glean/${Environment}/*"
      Events:
        SessionQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt GleanAgentQueue.Arn
            BatchSize: 1

  # SQS gave up on the message: mark its session failed. Nothing else, so it needs nothing else.
  AgentDeadLetterFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: glean.worker.dlq_handler
      Timeout: 30
      MemorySize: 128
      Tracing: Active
      Environment:
        Variables:
          AGENT_SESSIONS_TABLE: !Ref GleanAgentSessionsTable
          AGENT_SESSION_TTL_HOURS: !Ref AgentSessionTtlHours
      Policies:
        - AWSXrayWriteOnlyAccess
        - CloudWatchLogsFullAccess
        - DynamoDBCrudPolicy:
            TableName: !Ref GleanAgentSessionsTable
        - SQSPollerPolicy:
            QueueName: !GetAtt GleanAgentDeadLetterQueue.QueueName
      Events:
        DeadLetterQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt GleanAgentDeadLetterQueue.Arn
            BatchSize: 1

  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: glean.triggers.pre_signup.handler
      MemorySize: 128
      Timeout: 5
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:glean/${Environment}/*"

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PreSignUpFunction.Arn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      # SourceArn omitted to avoid circular dependency:
      # GleanUserPool -> PreSignUpFunction (LambdaConfig) -> GleanUserPool (SourceArn)
      # All Cognito user pools in this account/region can invoke; acceptable for single-pool setup.

  GleanFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GleanFunction}"
      RetentionInDays: 14

  AgentWorkerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AgentWorkerFunction}"
      RetentionInDays: 14

  AgentDeadLetterFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AgentDeadLetterFunction}"
      RetentionInDays: 14

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "glean-${Environment}-lambda-errors"
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref GleanFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref GleanUserPool
  UserPoolClientId:
    Value: !Ref GleanUserPoolClient
  CatalogueTableName:
    Value: !Ref GleanCatalogueTable
  AgentSessionsTableName:
    Value: !Ref GleanAgentSessionsTable
  AgentCheckpointsTableName:
    Value: !Ref GleanAgentCheckpointsTable
  AgentQueueUrl:
    Value: !Ref GleanAgentQueue
  AgentDeadLetterQueueUrl:
    Value: !Ref GleanAgentDeadLetterQueue
  CognitoDomain:
    Value: !Sub "${CognitoDomainPrefix}-${Environment}.auth.eu-west-2.amazoncognito.com"
