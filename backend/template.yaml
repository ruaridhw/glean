AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.13
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        POWERTOOLS_SERVICE_NAME: glean
        LOG_LEVEL: INFO
        GIT_SHA: !Ref GitSha
  HttpApi:
    AccessLogSettings:
      DestinationArn: !GetAtt ApiAccessLogGroup.Arn
      # Request metadata only: no headers or bodies, so no tokens.
      Format: >-
        {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime",
        "httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","path":"$context.path",
        "status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength",
        "responseLatency":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev

  CognitoDomainPrefix:
    Type: String
    Default: glean-auth

  LangSmithTracing:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"

  LangSmithEndpoint:
    Type: String
    # The Glean LangSmith workspace is EU-hosted; the SDK otherwise defaults to the US
    # endpoint (https://api.smith.langchain.com) and every trace POST 403s. Override per
    # deploy only if the workspace region changes.
    Default: "https://eu.api.smith.langchain.com"

  # Commit the deploy was built from, stamped by scripts/deploy_prod.py (`<sha>` or `<sha>-dirty`).
  GitSha:
    Type: String
    Default: unknown

Resources:
  # Every user's on-device data is keyed by their Cognito `sub`. A new pool
  # means new subs, which would orphan that data, so never let a stack
  # delete or replacement take this pool with it.
  GleanUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: glean-user-pool
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn

  GleanUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${CognitoDomainPrefix}-${Environment}"
      UserPoolId: !Ref GleanUserPool

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref GleanUserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        # Resolved by CloudFormation at deploy time, so neither samconfig nor CI ever holds the values.
        client_id: !Sub "{{resolve:secretsmanager:glean/${Environment}/google-oauth-client-id:SecretString}}"
        client_secret: !Sub "{{resolve:secretsmanager:glean/${Environment}/google-oauth-client-secret:SecretString}}"
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        username: sub

  GleanUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdentityProvider
    Properties:
      ClientName: glean-mobile-client
      UserPoolId: !Ref GleanUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - Google
      CallbackURLs:
        - glean://auth/callback
      LogoutURLs:
        - glean://auth/logout

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  GleanReceiptsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "glean-receipts-${Environment}-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          # Scanned receipt images are a one-day buffer. Scoped to their prefix so it can't reach exports.
          - Id: expire-receipt-scans
            Status: Enabled
            Prefix: receipts/
            ExpirationInDays: 1
          # Export diagnostics (POST /dev/export-db) are kept long enough to fetch and inspect.
          - Id: keep-diagnostics-exports
            Status: Enabled
            Prefix: db-exports/
            ExpirationInDays: 30

  # Durable store for the recipe corpus + recipe-api HTTP cache. No expiry — unlike the
  # receipts buffer, the corpus is durable data the app reads on every search/get.
  GleanRecipeCacheBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "glean-recipe-cache-${Environment}-${AWS::AccountId}"

  # Shared catalogue reference data (ADR 0001). Provisioned capacity is fixed so the whole
  # account stays inside the DynamoDB free tier: 5/5 for the table plus 5/5 for the GSI is
  # 10/10, against the 25/25 limit summed across every table and index in the region.
  GleanCatalogueTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "glean-catalogue-${Environment}"
      TableClass: STANDARD
      BillingMode: PROVISIONED
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: gsi_pk
          AttributeType: S
        - AttributeName: version
          AttributeType: N
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      GlobalSecondaryIndexes:
        - IndexName: by_version
          KeySchema:
            - AttributeName: gsi_pk
              KeyType: HASH
            - AttributeName: version
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  GleanFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: glean.main.handler
      Tracing: Active
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref GleanUserPool
          COGNITO_APP_CLIENT_ID: !Ref GleanUserPoolClient
          S3_RECEIPTS_BUCKET: !Ref GleanReceiptsBucket
          S3_RECIPE_CACHE_BUCKET: !Ref GleanRecipeCacheBucket
          CATALOGUE_TABLE: !Ref GleanCatalogueTable
          LANGSMITH_TRACING: !Ref LangSmithTracing
          LANGSMITH_API_KEY: !Sub "{{resolve:secretsmanager:glean/${Environment}/langsmith-api-key:SecretString}}"
          LANGSMITH_PROJECT: glean
          LANGSMITH_ENDPOINT: !Ref LangSmithEndpoint
          LANGCHAIN_CALLBACKS_BACKGROUND: "false"
      Policies:
        - AWSXrayWriteOnlyAccess
        - CloudWatchLogsFullAccess
        - S3CrudPolicy:
            BucketName: !Ref GleanReceiptsBucket
        - S3CrudPolicy:
            BucketName: !Ref GleanRecipeCacheBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref GleanCatalogueTable
        - arn:aws:iam::aws:policy/AmazonTextractFullAccess
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:glean/${Environment}/*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: glean.triggers.pre_signup.handler
      MemorySize: 128
      Timeout: 5
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:glean/${Environment}/*"

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PreSignUpFunction.Arn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      # SourceArn omitted to avoid circular dependency:
      # GleanUserPool -> PreSignUpFunction (LambdaConfig) -> GleanUserPool (SourceArn)
      # All Cognito user pools in this account/region can invoke; acceptable for single-pool setup.

  GleanFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GleanFunction}"
      RetentionInDays: 14

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "glean-${Environment}-lambda-errors"
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref GleanFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref GleanUserPool
  UserPoolClientId:
    Value: !Ref GleanUserPoolClient
  CatalogueTableName:
    Value: !Ref GleanCatalogueTable
  CognitoDomain:
    Value: !Sub "${CognitoDomainPrefix}-${Environment}.auth.eu-west-2.amazoncognito.com"
