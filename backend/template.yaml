AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.13
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        POWERTOOLS_SERVICE_NAME: glean
        LOG_LEVEL: INFO

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev

  CognitoDomainPrefix:
    Type: String
    Default: glean-auth

  LangSmithTracing:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"

  LangSmithEndpoint:
    Type: String
    # The Glean LangSmith workspace is EU-hosted; the SDK otherwise defaults to the US
    # endpoint (https://api.smith.langchain.com) and every trace POST 403s. Override per
    # deploy only if the workspace region changes.
    Default: "https://eu.api.smith.langchain.com"

  GoogleClientId:
    Type: String
    NoEcho: true

  GoogleClientSecret:
    Type: String
    NoEcho: true

Resources:
  GleanUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: glean-user-pool
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn

  GleanUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${CognitoDomainPrefix}-${Environment}"
      UserPoolId: !Ref GleanUserPool

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref GleanUserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        username: sub

  GleanUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdentityProvider
    Properties:
      ClientName: glean-mobile-client
      UserPoolId: !Ref GleanUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - Google
      CallbackURLs:
        - glean://auth/callback
      LogoutURLs:
        - glean://auth/logout

  GleanReceiptsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "glean-receipts-${Environment}-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Status: Enabled
            ExpirationInDays: 1

  # Durable store for the recipe corpus + recipe-api HTTP cache. No expiry — unlike the
  # receipts buffer, the corpus is durable data the app reads on every search/get.
  GleanRecipeCacheBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "glean-recipe-cache-${Environment}-${AWS::AccountId}"

  GleanFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: glean.main.handler
      Tracing: Active
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref GleanUserPool
          COGNITO_APP_CLIENT_ID: !Ref GleanUserPoolClient
          S3_RECEIPTS_BUCKET: !Ref GleanReceiptsBucket
          S3_RECIPE_CACHE_BUCKET: !Ref GleanRecipeCacheBucket
          LANGSMITH_TRACING: !Ref LangSmithTracing
          LANGSMITH_API_KEY: !Sub "{{resolve:secretsmanager:glean/${Environment}/langsmith-api-key:SecretString}}"
          LANGSMITH_PROJECT: glean
          LANGSMITH_ENDPOINT: !Ref LangSmithEndpoint
          LANGCHAIN_CALLBACKS_BACKGROUND: "false"
      Policies:
        - AWSXrayWriteOnlyAccess
        - CloudWatchLogsFullAccess
        - S3CrudPolicy:
            BucketName: !Ref GleanReceiptsBucket
        - S3CrudPolicy:
            BucketName: !Ref GleanRecipeCacheBucket
        - arn:aws:iam::aws:policy/AmazonTextractFullAccess
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:glean/${Environment}/*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: glean.triggers.pre_signup.handler
      MemorySize: 128
      Timeout: 5
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:glean/${Environment}/*"

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PreSignUpFunction.Arn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      # SourceArn omitted to avoid circular dependency:
      # GleanUserPool -> PreSignUpFunction (LambdaConfig) -> GleanUserPool (SourceArn)
      # All Cognito user pools in this account/region can invoke; acceptable for single-pool setup.

  GleanFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GleanFunction}"
      RetentionInDays: 14

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "glean-${Environment}-lambda-errors"
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref GleanFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref GleanUserPool
  UserPoolClientId:
    Value: !Ref GleanUserPoolClient
  CognitoDomain:
    Value: !Sub "${CognitoDomainPrefix}-${Environment}.auth.eu-west-2.amazoncognito.com"
