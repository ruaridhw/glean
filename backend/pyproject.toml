[project]
name = "glean"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "mangum",
    "pydantic-settings",
    "aws-lambda-powertools",
    "python-jose[cryptography]",
    "slowapi",
    "boto3",
    "aws-xray-sdk>=2.15.0",
    "python-multipart>=0.0.24",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.4.0",
    "beautifulsoup4>=4.14.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pre-commit>=4.5",
    "ruff>=0.15",
    "black>=26.0",
    "vulture>=2.16",
    "typos>=1.45,<2",
    "ty>=0.0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=glean --cov-report=term-missing --cov-fail-under=80"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
    "vulture>=2.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/glean"]

[tool.ruff]
src = ["src"]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "W", "C4", "C90", "PT", "RUF", "A", "T20", "PIE", "RET", "TCH", "ASYNC", "FLY", "PERF", "PLC", "PLE"]
per-file-ignores = { "tests/**" = ["S101"], "vulture_whitelist.py" = ["B018", "F821"] }

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.coverage.run]
source = ["glean"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.vulture]
min_confidence = 60
paths = ["src/", "vulture_whitelist.py"]

[tool.typos.default]
locale = "en-gb"

[tool.typos.default.extend-words]
# Standard spellings in HTTP headers, AWS APIs, and OAuth specs
Authorization = "Authorization"
# FastAPI/Starlette constant name — cannot be changed
Unauthorized = "Unauthorized"
# boto3 Textract API uses American spelling — cannot be changed to match en-gb locale
analyze = "analyze"
