[project]
name = "glean"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.135.3,<1",
    "mangum>=0.21.0,<1",
    "pydantic-settings>=2.13.1,<3",
    "aws-lambda-powertools>=3.27.0,<4",
    "python-jose[cryptography]>=3.5.0,<4",
    "slowapi>=0.1.9,<1",
    "boto3>=1.42.85,<2",
    "aws-xray-sdk>=2.15.0,<3",
    "python-multipart>=0.0.24,<1",
    "httpx>=0.28.1,<1",
    "langchain-openrouter>=0.2.0,<1",
    "langsmith>=0.7.0,<1",
    "beautifulsoup4>=4.14.3,<5",
    "pydantic>=2.12.5",
    "limits>=5.8,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/tests"]
addopts = "--cov=glean --cov-report=term-missing --cov-fail-under=80 --ignore=tests/integration"
markers = [
    "soft_gate: marks tests as soft-gate evaluations (deselect with '-m \"not soft_gate\"')",
    "integration: marks tests that require real external service credentials (skipped in CI unless credentials are provided)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
audit = [
    "playwright>=1.50,<2",
]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0,<8",
    "pre-commit>=4.2.0,<5",
    "ruff>=0.15.9,<1",
    "vulture>=2.16,<3",
    "typos>=1.45.0,<2",
    "ty>=0.0.29,<1",
    "moto[dynamodb,s3]>=5.2.4,<6",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/glean"]

[tool.ruff]
src = ["src"]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "W", "C4", "C90", "PT", "RUF", "A", "T20", "PIE", "RET", "TCH", "ASYNC", "FLY", "PERF", "PLC", "PLE", "TID251"]
per-file-ignores = { "tests/**" = ["S101", "S311", "PERF401"], "scripts/tests/**" = ["S101"], "tests/conftest.py" = ["E402"], "vulture_whitelist.py" = ["B018", "F821"], "scripts/**" = ["T20", "S110"], "scripts/judge_study/report.py" = ["E501", "RUF001", "RUF003"], "src/glean/llm.py" = ["TID251"], "!src/**" = ["TID251"] }

# glean.llm wraps the LLM libraries once, so the rest of src/glean calls LLMRouter with glean's own types. Tests, evals
# and dev scripts outside src/ may still drive a chat model directly (the per-file-ignores above).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"langchain_core".msg = "Only glean.llm imports LangChain; call LLMRouter.invoke instead."
"langchain_openrouter".msg = "Only glean.llm imports LangChain; call LLMRouter.invoke instead."
"openrouter".msg = "Only glean.llm imports the OpenRouter SDK; call LLMRouter instead."

[tool.ruff.format]
# Parity with the previous black config. line-length (120) and target-version
# (py313) are set in [tool.ruff] above; these are black's defaults, stated
# explicitly so the formatting contract does not drift.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.coverage.run]
source = ["glean"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.vulture]
min_confidence = 60
paths = ["src/", "vulture_whitelist.py"]

[tool.typos.default]
locale = "en-gb"
# Historical coconut alias in the seed and v1 fixture: keep misspelled inputs resolving, not the word elsewhere.
extend-ignore-re = ['"dessicated coconut"']

[tool.typos.default.extend-words]
# Standard spellings in HTTP headers, AWS APIs, and OAuth specs
Authorization = "Authorization"
authorize = "authorize"
# FastAPI/Starlette constant name — cannot be changed
Unauthorized = "Unauthorized"
# boto3 Textract API uses American spelling — cannot be changed to match en-gb locale
analyze = "analyze"
# AWS SAM sets this environment variable name when building Lambda functions
ARTIFACTS = "ARTIFACTS"
# Recipe names may refer to chile peppers, not the British spelling of the country.
Chile = "Chile"
# US recipes and test inputs spell the peppers chiles and chili.
chiles = "chiles"
chili = "chili"
# Thai fish sauce (nam pla), a catalogue alias.
nam = "nam"
# Import code mirrors upstream/API spelling and mobile's existing normalization module name.
normalization = "normalization"
serialization = "serialization"
milliliter = "milliliter"
milliliters = "milliliters"
liter = "liter"
liters = "liters"
centimeter = "centimeter"
centimeters = "centimeters"
fiber = "fiber"
fiberContent = "fiberContent"
# Library and web spellings: AWS TransactionCanceledException, Python's unicodedata.normalize and weakref.finalize,
# and the CSS and SVG in the judge-study HTML pages ("ax" is the chart-axis class).
canceled = "canceled"
normalize = "normalize"
finalize = "finalize"
color = "color"
center = "center"
ax = "ax"
# Test data: a search prefix for "Baked", a deliberate typo among the normalisation eval's typed names, an outcome
# label (an accepted spelling) and the tail of "look-alikes".
ba = "ba"
choclate = "choclate"
unparseable = "unparseable"
alikes = "alikes"
