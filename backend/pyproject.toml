[project]
name = "glean"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.135.3,<1",
    "mangum>=0.21.0,<1",
    "pydantic-settings>=2.13.1,<3",
    "aws-lambda-powertools>=3.27.0,<4",
    "python-jose[cryptography]>=3.5.0,<4",
    "slowapi>=0.1.9,<1",
    "boto3>=1.42.85,<2",
    "aws-xray-sdk>=2.15.0,<3",
    "python-multipart>=0.0.24,<1",
    "httpx>=0.28.1,<1",
    "langchain-openrouter>=0.2.0,<1",
    "langsmith>=0.7.0,<1",
    "beautifulsoup4>=4.14.3,<5",
    "pydantic>=2.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0,<8",
    "pre-commit>=4.2.0,<5",
    "ruff>=0.15.9,<1",
    "black>=26.3.1,<27",
    "vulture>=2.16,<3",
    "typos>=1.45.0,<2",
    "ty>=0.0.29,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=glean --cov-report=term-missing --cov-fail-under=80 --ignore=tests/integration"
markers = [
    "soft_gate: marks tests as soft-gate evaluations (deselect with '-m \"not soft_gate\"')",
    "integration: marks tests that require real external service credentials (skipped in CI unless credentials are provided)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.15.9,<1",
    "vulture>=2.16,<3",

]

[tool.hatch.build.targets.wheel]
packages = ["src/glean"]

[tool.ruff]
src = ["src"]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "W", "C4", "C90", "PT", "RUF", "A", "T20", "PIE", "RET", "TCH", "ASYNC", "FLY", "PERF", "PLC", "PLE"]
per-file-ignores = { "tests/**" = ["S101", "PERF401"], "tests/conftest.py" = ["E402"], "vulture_whitelist.py" = ["B018", "F821"], "scripts/**" = ["T20", "S110"] }

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.coverage.run]
source = ["glean"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.vulture]
min_confidence = 60
paths = ["src/", "vulture_whitelist.py"]

[tool.typos.default]
locale = "en-gb"

[tool.typos.default.extend-words]
# Standard spellings in HTTP headers, AWS APIs, and OAuth specs
Authorization = "Authorization"
# FastAPI/Starlette constant name — cannot be changed
Unauthorized = "Unauthorized"
# boto3 Textract API uses American spelling — cannot be changed to match en-gb locale
analyze = "analyze"
