services:
  backend:
    build:
      context: ./backend
      target: runtime
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ENVIRONMENT: dev
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/.cache/glean_recipe_cache:/app/.cache/glean_recipe_cache
