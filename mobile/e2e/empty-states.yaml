appId: com.ruaridhw.glean
name: "Empty States: each tab shows guidance when empty"
---
# clearState in launch helper guarantees empty DB
- runFlow: helpers/launch.yaml

# Pantry empty state
- runFlow:
    file: helpers/navigate-tab.yaml
    env:
      tab: pantry
- assertVisible:
    id: "pantry.emptyState"
- assertVisible: "Your pantry is empty"
- assertVisible: "Scan receipt"
- assertVisible: "Describe items"

# Meals empty state
- runFlow:
    file: helpers/navigate-tab.yaml
    env:
      tab: meals
- assertVisible:
    id: "meals.emptyState"
- assertVisible: "No recipes yet"
- assertVisible: "Search recipes"

# Plan empty state
- runFlow:
    file: helpers/navigate-tab.yaml
    env:
      tab: plan
- assertVisible:
    id: "plan.emptyState"
- assertVisible: "No meals planned this week"

# Shop empty state
- runFlow:
    file: helpers/navigate-tab.yaml
    env:
      tab: shop
- assertVisible:
    id: "shop.emptyState"
- assertVisible: "Your shopping list is empty"
- assertVisible: "Go to meal plan"

# Describe items CTA navigates to describe screen
- runFlow:
    file: helpers/navigate-tab.yaml
    env:
      tab: pantry
- tapOn: "Describe items"
- assertVisible: "Describe your shop"
