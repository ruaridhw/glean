appId: ${APP_ID}
name: "Screens: all main screens render key elements"
---
- runFlow: helpers/launch.yaml

# Pantry: heading and FAB
- runFlow:
    file: helpers/navigate-tab.yaml
    env:
      tab: pantry
- assertVisible: "Pantry"
- assertVisible: "Add pantry item"

# Meals: heading and tab toggles
- runFlow:
    file: helpers/navigate-tab.yaml
    env:
      tab: meals
- assertVisible: "Meals"
- assertVisible: "Saved (0)"
- assertVisible: "Search"

# Plan: heading and generate button
- runFlow:
    file: helpers/navigate-tab.yaml
    env:
      tab: plan
- assertVisible: "This Week"
- assertVisible: "Generate"

# Shop: heading
- runFlow:
    file: helpers/navigate-tab.yaml
    env:
      tab: shop
- assertVisible: "Shopping"

# Settings: heading
- runFlow:
    file: helpers/navigate-tab.yaml
    env:
      tab: settings
- assertVisible: "Settings"
