appId: com.ruaridhw.glean
name: "Toast: success message after pantry item added"
---
- runFlow: helpers/launch.yaml

- runFlow:
    file: helpers/navigate-tab.yaml
    env:
      tab: pantry
- tapOn:
    id: "pantry.fab"
- assertVisible: "Manual Entry"
- tapOn: "Manual Entry"

- assertVisible:
    id: "manualEntry.nameInput"
- tapOn:
    id: "manualEntry.nameInput"
- inputText: "toast test item"
- tapOn:
    id: "manualEntry.quantityInput"
- inputText: "100"
- tapOn:
    id: "manualEntry.saveButton"

# Toast uses react-native-toast-message — renders as a visible text overlay
- assertVisible: "Added to pantry"
