appId: ${APP_ID}
name: "Scan Progress: scan screen loads"
---
- runFlow: helpers/launch.yaml

- runFlow:
    file: helpers/navigate-tab.yaml
    env:
      tab: Pantry

# Navigate to scan — try FAB route (works whether pantry is empty or not)
- tapOn: "Add pantry item"
- tapOn: "Scan Receipt"

# Grant camera permission if prompted (Android system dialog)
- runFlow:
    when:
      visible: "While using the app"
    file: helpers/grant-camera-permission.yaml
