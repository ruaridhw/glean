repos:
  # ─── Python / Backend ────────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: https://github.com/crate-ci/typos
    rev: v1.45.0
    hooks:
      - id: typos
        files: ^backend/
  - repo: local
    hooks:
      - id: commit-msg-policy
        name: commit message policy
        language: system
        entry: python3 scripts/check_commit_msg.py
        pass_filenames: true
        stages: [commit-msg]
      - id: vulture
        name: vulture (dead code)
        language: system
        entry: bash -c 'cd backend && uv run vulture src/ vulture_whitelist.py'
        pass_filenames: false
        files: ^backend/.*\.py$

  # ─── Dart / Flutter ──────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: dart-format
        name: dart format (write)
        language: system
        entry: bash -c 'cd app && dart format lib test integration_test'
        pass_filenames: false
        files: ^app/.*\.dart$
        exclude: ^app/.*\.(g|drift|mocks)\.dart$
      - id: flutter-analyze
        name: flutter analyze
        language: system
        entry: bash -c 'cd app && flutter analyze'
        pass_filenames: false
        files: ^app/.*\.dart$
        exclude: ^app/.*\.(g|drift|mocks)\.dart$
