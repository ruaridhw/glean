AWSTemplateFormatVersion: '2010-09-09'
Description: Glean GitHub Actions OIDC provider and deployment IAM roles

Parameters:
  GitHubOrg:
    Type: String
    Default: ruaridhw
  GitHubRepo:
    Type: String
    Default: glean
  # Supplied when the stack is applied (--parameter-overrides AlertEmail=...); never committed, the repo is public.
  AlertEmail:
    Type: String
    AllowedPattern: '[^@\s]+@[^@\s]+'
    ConstraintDescription: must be an email address

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  GleanDeployPolicyProd:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: GleanDeployPolicyProd
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: cloudformation:*
            Resource: '*'
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
              - s3:GetBucketLocation
              - s3:CreateBucket
            Resource:
              - !Sub 'arn:aws:s3:::glean-sam-artefacts-prod-${AWS::AccountId}'
              - !Sub 'arn:aws:s3:::glean-sam-artefacts-prod-${AWS::AccountId}/*'
          # CloudFormation manages the app's own buckets (receipts, recipe cache) with
          # the deploy role's credentials, so it needs full control of those too.
          - Effect: Allow
            Action: s3:*
            Resource:
              - !Sub 'arn:aws:s3:::glean-receipts-prod-${AWS::AccountId}'
              - !Sub 'arn:aws:s3:::glean-receipts-prod-${AWS::AccountId}/*'
              - !Sub 'arn:aws:s3:::glean-recipe-cache-prod-${AWS::AccountId}'
              - !Sub 'arn:aws:s3:::glean-recipe-cache-prod-${AWS::AccountId}/*'
          # The catalogue table (ADR 0001) is created and updated by CloudFormation with the deploy
          # role's credentials; scope it to this environment's table and its indexes.
          - Effect: Allow
            Action: dynamodb:*
            Resource:
              - !Sub 'arn:aws:dynamodb:*:${AWS::AccountId}:table/glean-catalogue-prod'
              - !Sub 'arn:aws:dynamodb:*:${AWS::AccountId}:table/glean-catalogue-prod/index/*'
          - Effect: Allow
            Action:
              - dynamodb:DescribeLimits
              - dynamodb:ListTables
            Resource: '*'
          - Effect: Allow
            Action: lambda:*
            Resource: '*'
          - Effect: Allow
            Action: apigateway:*
            Resource: '*'
          - Effect: Allow
            Action: cognito-idp:*
            Resource: '*'
          - Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:PassRole
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:TagRole
              - iam:UntagRole
            Resource: '*'
          - Effect: Allow
            Action:
              - logs:*
              - cloudwatch:*
              - xray:*
              - textract:*
            Resource: '*'
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Sub 'arn:aws:secretsmanager:eu-west-2:${AWS::AccountId}:secret:glean/prod/*'

  GleanDeployRoleProd:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GleanDeployRoleProd
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !GetAtt GitHubOidcProvider.Arn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:prod'
      ManagedPolicyArns:
        - !Ref GleanDeployPolicyProd

  # ADR 0001: the catalogue must stay inside the DynamoDB free tier, so any DynamoDB charge at all is an alert.
  DynamoDbChargeBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: glean-dynamodb-any-charge
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 0.01
          Unit: USD
        CostFilters:
          Service:
            - Amazon DynamoDB
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            # Budgets rejects an absolute threshold under $0.10, so alert at 100% of the $0.01 limit instead.
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  GleanDeployRoleProdArn:
    Value: !GetAtt GleanDeployRoleProd.Arn
  OidcProviderArn:
    Value: !GetAtt GitHubOidcProvider.Arn
